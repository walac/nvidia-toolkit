---
# ============================================
# Upgrade Playbook: Nvidia Drivers, CUDA, Ollama
# ============================================
# Applies package upgrades using the lists and versions in
# group_vars/all.yml. CUDA stream follows cuda_version; Ollama
# is always refreshed to the latest GitHub release.
#
# Usage:
#   ansible-playbook -K playbooks/maintenance/upgrade.yml
#
# NOTE: A manual reboot may be required if driver packages change.
# ============================================

- name: Upgrade Nvidia GPU Stack
  hosts: all
  become: true
  gather_facts: true
  vars:
    package_state: latest

  pre_tasks:
    - name: Update DNF cache
      ansible.builtin.dnf:
        update_cache: true

  roles:
    - role: nvidia-driver
      tags: ["driver", "nvidia"]

    - role: cuda
      tags: ["cuda", "toolkit"]

    - role: inference-stack
      when: install_inference
      tags: ["inference", "ollama"]

  post_tasks:
    - name: Display upgrade summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Nvidia GPU Stack Upgrade Complete"
          - "=========================================="
          - "CUDA target version: {{ cuda_version }}"
          - "Inference: {{ 'latest Ollama release' if install_inference else 'skipped' }}"
          - ""
          - "If the nvidia-driver role reported a package change,"
          - "reboot manually so the new kernel modules load."
          - ""
          - "Verify installation:"
          - "  nvidia-smi"
          - "  nvcc --version"
          - "  ollama list"
          - "=========================================="

---
# tasks file for cuda

- name: Display CUDA installation information
  debug:
    msg:
      - "Installing CUDA {{ cuda_version }} on {{ ansible_facts['distribution'] }} {{
        ansible_facts['distribution_version'] }}"
      - "CUDA Home will be: {{ cuda_home }}"

- name: Set distribution-specific CUDA repository paths
  set_fact:
    cuda_dist_id: "{{ 'fedora' if ansible_facts['distribution'] == 'Fedora' else 'rhel' }}"
    # Fedora version fallback: use max supported version if current is newer
    cuda_dist_version: "{{ cuda_fedora_max_version if (ansible_facts['distribution'] == 'Fedora' and (ansible_facts['distribution_major_version'] | int) > (cuda_fedora_max_version | int)) else ansible_facts['distribution_major_version'] }}"

- name: Display repository information
  debug:
    msg:
      "Using CUDA repository for {{ cuda_dist_id }}{{ cuda_dist_version }} (running on {{
      ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }})"

- name: Add Nvidia CUDA Repository
  yum_repository:
    name: cuda
    description: Nvidia CUDA Repository
    baseurl: "https://developer.download.nvidia.com/compute/cuda/repos/{{ cuda_dist_id }}{{ cuda_dist_version }}/{{ cuda_repo_arch }}/"
    gpgkey: "https://developer.download.nvidia.com/compute/cuda/repos/{{ cuda_dist_id }}{{ cuda_dist_version }}/{{ cuda_repo_arch }}/{{ cuda_repo_gpgkey_id }}.pub"
    gpgcheck: true
    enabled: true
    # Exclude driver packages to prevent conflict with RPM Fusion akmods
    exclude: "xorg-x11-drv-nvidia* kmod-nvidia* akmod-nvidia* nvidia-driver* nvidia-settings* *cuda-drivers* nvidia-kmod-common* nvidia-modprobe* nvidia-persistenced*"
  register: cuda_repo

- name: Update DNF cache for CUDA repository
  dnf:
    update_cache: true
  when: cuda_repo is changed or package_state == "latest"

- name: Install CUDA Toolkit
  dnf:
    name: "{{ cuda_packages }}"
    state: "{{ package_state }}"
  register: cuda_install

- name: Collect installed package facts
  package_facts:
    manager: rpm

- name: Remove CUDA toolkit streams that do not match cuda_version
  dnf:
    name: "{{ item }}"
    state: absent
    autoremove: true
  loop: "{{ ansible_facts.packages | list | select('match', '^cuda-toolkit-[0-9]+-[0-9]+$') | list }}"
  when: item != ('cuda-toolkit-' ~ (cuda_version | replace('.', '-')))

- name: Create CUDA symlink
  file:
    src: "{{ cuda_home }}"
    dest: "{{ cuda_symlink }}"
    state: link
    force: true

- name: Setup CUDA environment variables
  template:
    src: cuda.sh.j2
    dest: /etc/profile.d/cuda.sh
    owner: root
    group: root
    mode: "0644"

- name: Verify CUDA installation
  command: "{{ cuda_symlink }}/bin/nvcc --version"
  register: cuda_nvcc_check
  changed_when: false
  failed_when: cuda_nvcc_check.rc != 0
